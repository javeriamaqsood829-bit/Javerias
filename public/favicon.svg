<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#080809" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Subtle Border -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" ry="15" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Modern Geometric Growth Symbol ('S' combined with upward growth trajectory) -->
  <g filter="url(#glow)">
    <!-- Ascending Growth Bars -->
    <rect x="14" y="36" width="6" height="14" rx="3" fill="#f59e0b" opacity="0.6" />
    <rect x="23" y="27" width="6" height="23" rx="3" fill="#f59e0b" opacity="0.85" />
    <rect x="32" y="18" width="6" height="32" rx="3" fill="url(#amberGrad)" />
    
    <!-- Dynamic Upward Arrow Head / Cap -->
    <path d="M 33 13 L 49 13 L 49 29 M 49 13 L 28 34" fill="none" stroke="url(#amberGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Accent Point -->
  <circle cx="49" cy="13" r="3" fill="#fef08a" />
</svg>
