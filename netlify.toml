# Netlify configuration for Single Page Application (SPA)

[build]
  # Directory that contains the deploy-ready files after build
  publish = "dist"
  # Default build command
  command = "npm run build"

# SPA routing redirect: ensures deep linking, direct URLs and page refreshes load index.html properly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
